<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PraiaGo">
  <!--
    Favicon do PraiaGo. Substitui o raio roxo do Vite, que veio no template e
    ficou nas abas dos quatro sites por meses.

    So a palmeira, sem a palavra "PraiaGo": na aba o icone renderiza a 16px, e
    nesse tamanho a palavra vira borrao. A palmeira e a parte da marca que
    sobrevive ao tamanho pequeno.

    Fundo com gradiente cheio e palmeira branca, em vez do fundo menta claro do
    icone do app: aba de navegador costuma ser clara, e um icone claro sobre
    fundo claro some. As cores sao as mesmas da marca (o azul e o verde do
    "PraiaGo" escrito).
  -->
  <defs>
    <linearGradient id="mar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.55" stop-color="#10a37a"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#mar)"/>

  <!-- Palmeira: tronco levemente curvado, como no icone do app. -->
  <path d="M33.4 49.5c-.6-7.4-1.2-13.6-3.6-21.2l3.1-.9c2.5 7.9 3.1 14.3 3.7 21.9z" fill="#ffffff"/>

  <!-- Folhas: uma so forma, girada em volta da copa (30,27). O leque cobre de
       cima-esquerda a cima-direita, com as pontas caindo — e o desenho de
       palmeira que se reconhece na miniatura. -->
  <g fill="#ffffff" transform="translate(30.5 27)">
    <g id="f"><path d="M0 0C8-7 18-7 25 1 18-2 9 0 0 3Z"/></g>
    <use href="#f" transform="rotate(-38)"/>
    <use href="#f" transform="rotate(-76)"/>
    <use href="#f" transform="rotate(-114)"/>
    <use href="#f" transform="rotate(-152)"/>
    <use href="#f" transform="rotate(-190)"/>
    <use href="#f" transform="rotate(28)"/>
  </g>

  <!-- Coco no centro da copa: fecha o vao onde as folhas se encontram. -->
  <circle cx="30.5" cy="27" r="2.6" fill="#ffffff"/>

  <!-- Onda do rodape, igual a do icone do app. -->
  <path d="M0 52c8-3.4 14-3.4 22 0s14 3.4 22 0 12-2.6 20 .4V64H0z" fill="#ffffff" opacity="0.28"/>
</svg>
